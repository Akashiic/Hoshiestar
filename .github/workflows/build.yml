name: Build

on:
  push:
    branches: [ "26.1.2" ]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [ "26.1.2" ]
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Decompiles Minecraft and applies patches/ into projects/youer/src
      - name: Setup workspace
        run: ./gradlew setup --no-configuration-cache

      - name: Build server jar
        run: ./gradlew hoshiestarJar --no-configuration-cache

      - name: Locate jar
        id: jar
        run: |
          JAR=$(ls projects/youer/build/libs/hoshiestar-*.jar | head -n 1)
          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$JAR" .jar)" >> "$GITHUB_OUTPUT"
          sha256sum "$JAR"

      - name: Smoke test (boot, stop, clean save)
        run: bash .github/scripts/smoke-test.sh "${{ steps.jar.outputs.path }}"

      - name: Upload server jar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.jar.outputs.name }}
          path: ${{ steps.jar.outputs.path }}
          retention-days: 14
          if-no-files-found: error
