name: Release

# Publishes a GitHub release with the server jar.
#   - push a tag:      git tag v26.1.2-1 && git push origin v26.1.2-1
#   - or run manually: Actions -> Release -> Run workflow (creates the tag on the selected commit)
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v26.1.2-1)"
        required: true
      prerelease:
        description: "Mark as pre-release"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            PRE="${{ inputs.prerelease }}"
          else
            TAG="${GITHUB_REF_NAME}"
            # tags such as v26.1.2-1-beta / -rc / -alpha are published as pre-releases
            case "$TAG" in *alpha*|*beta*|*rc*) PRE=true ;; *) PRE=false ;; esac
          fi
          case "$TAG" in v*) ;; *) echo "::error::Tag must start with 'v' (got '$TAG')"; exit 1 ;; esac
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists"; exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRE" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Setup workspace
        run: ./gradlew setup --no-configuration-cache

      - name: Build server jar
        run: ./gradlew youerJar --no-configuration-cache

      - name: Prepare release files
        id: files
        run: |
          SRC=$(ls projects/youer/build/libs/*-server.jar | head -n 1)
          NAME="Hoshiestar-${{ steps.tag.outputs.version }}.jar"
          mkdir -p dist
          cp "$SRC" "dist/$NAME"
          (cd dist && sha256sum "$NAME" > "$NAME.sha256")
          NEOFORGE=$(unzip -l "$SRC" | sed -n 's#.*data/neoforge-\(.*\)-universal\.jar#\1#p' | head -n 1)
          MC=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "neoforge=$NEOFORGE" >> "$GITHUB_OUTPUT"
          echo "minecraft=$MC" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d' ' -f1 "dist/$NAME.sha256")" >> "$GITHUB_OUTPUT"

      - name: Smoke test (boot, stop, clean save)
        run: bash .github/scripts/smoke-test.sh "dist/${{ steps.files.outputs.name }}"

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          ## Hoshiestar ${{ steps.tag.outputs.version }}

          | | |
          |---|---|
          | Minecraft | ${{ steps.files.outputs.minecraft }} |
          | NeoForge | ${{ steps.files.outputs.neoforge }} |
          | Java | 25 |
          | Commit | \`${GITHUB_SHA::9}\` |
          | SHA-256 | \`${{ steps.files.outputs.sha256 }}\` |

          ### Como usar

          1. Coloque \`${{ steps.files.outputs.name }}\` numa pasta vazia (ou no lugar do jar antigo).
          2. Rode \`java -Xms4G -Xmx8G -jar ${{ steps.files.outputs.name }} nogui\` (ajuste a memória).
          3. Na primeira execução as bibliotecas são extraídas de dentro do próprio jar para \`libraries/\`;
             nada é baixado da internet.

          Mods vão em \`mods/\` e plugins Bukkit/Paper em \`plugins/\`.
          EOF

          PRE_FLAG=""
          [ "${{ steps.tag.outputs.prerelease }}" = "true" ] && PRE_FLAG="--prerelease"

          gh release create "${{ steps.tag.outputs.tag }}" \
            "dist/${{ steps.files.outputs.name }}" \
            "dist/${{ steps.files.outputs.name }}.sha256" \
            --target "$GITHUB_SHA" \
            --title "Hoshiestar ${{ steps.tag.outputs.version }}" \
            --notes-file notes.md \
            --generate-notes \
            $PRE_FLAG
